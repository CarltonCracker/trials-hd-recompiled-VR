# Trials HD - Configuration for Apple Silicon M3 (720p 60 FPS)

[Display]
display_width = 1280
display_height = 720
fullscreen = false
host_vsync = true

[GPU]
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1
fps_unlock = true
present_fps_limit = 60
readback_memexport = false
readback_resolve = "fast"
readback_resolve_max_bytes = 65536
async_shader_compilation = true
store_shaders = true
