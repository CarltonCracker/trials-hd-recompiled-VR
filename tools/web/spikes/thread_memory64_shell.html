<!doctype html>
<meta charset="utf-8">
<title>Trials HD web spike: pthreads and Memory64</title>
<pre id="result">Starting 48 prepooled workers…</pre>
<script>
const started = performance.now();
let mainStartupMs;
let complete, fail;
window.spikeResult = new Promise((resolve, reject) => { complete = resolve; fail = reject; });
var Module = {
  print(text) {
    console.log(text);
    if (text === 'THREAD_MEMORY64_MAIN') mainStartupMs = performance.now() - started;
    if (text.startsWith('THREAD_MEMORY64_RESULT ')) {
      const result = {
        ...JSON.parse(text.slice('THREAD_MEMORY64_RESULT '.length)),
        startupMs: mainStartupMs,
        pageToResultMs: performance.now() - started,
        userAgent: navigator.userAgent,
        crossOriginIsolated,
      };
      document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
      complete(result);
    }
  },
  printErr(text) { console.error(text); },
  onAbort(reason) { fail(new Error(String(reason))); },
};
if (!crossOriginIsolated) fail(new Error('Use tools/web/serve.py: cross-origin isolation is required'));
</script>
